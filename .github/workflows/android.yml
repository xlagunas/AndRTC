name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checkstyle:
    name: Checkstyle (spotless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build.gradle reads git tags and commit count for versioning

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Run spotless
        run: ./gradlew spotlessCheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build.gradle reads git tags and commit count for versioning

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$GOOGLE_SERVICES" ]; then
            # GitHub does not pass secrets to PRs from forks, and Dependabot PRs only get
            # Dependabot secrets. Debug builds and unit tests don't reach Firebase, so a
            # placeholder with the app's package names is enough for those PRs.
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "::warning::GOOGLE_SERVICES is not available to this PR; building with a placeholder google-services.json"
              cp .github/ci/google-services.placeholder.json app/google-services.json
              exit 0
            fi
            echo "::error::Missing repository secret GOOGLE_SERVICES (app/google-services.json, raw JSON or base64)"
            exit 1
          fi
          # Accept the secret either as raw JSON or base64-encoded JSON
          if printf '%s' "$GOOGLE_SERVICES" | tr -d '[:space:]' | head -c1 | grep -q '{'; then
            printf '%s' "$GOOGLE_SERVICES" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES" | base64 --decode --ignore-garbage > app/google-services.json
          fi
          if ! jq -e '.project_info and .client' app/google-services.json > /dev/null; then
            echo "::error::GOOGLE_SERVICES secret does not decode to a valid google-services.json"
            exit 1
          fi

      - name: Assemble debug
        run: ./gradlew assembleDevelopmentDebug

      - name: Check E2E isolation and run E2E unit tests
        run: ./gradlew :app:checkE2eIsolation :app:testE2eDebugUnitTest

      - name: Run unit tests
        run: ./gradlew testDevelopmentDebugUnitTest --continue

      - name: Run coverage script tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Generate coverage report
        run: >-
          ./gradlew :koverHtmlReportCoverage :koverXmlReportCoverage
          :app:koverXmlReportCoverage :core:koverXmlReportCoverage :user:koverXmlReportCoverage :contact:koverXmlReportCoverage :call:koverXmlReportCoverage :conference:koverXmlReportCoverage :push:koverXmlReportCoverage :signaling:koverXmlReportCoverage

      - name: Write coverage summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/coverage_summary.py \
            --total build/reports/kover/reportCoverage.xml \
            --run-url "$RUN_URL" \
            --module app=app/build/reports/kover/reportCoverage.xml \
            --module core=core/build/reports/kover/reportCoverage.xml \
            --module user=user/build/reports/kover/reportCoverage.xml \
            --module contact=contact/build/reports/kover/reportCoverage.xml \
            --module call=call/build/reports/kover/reportCoverage.xml \
            --module conference=conference/build/reports/kover/reportCoverage.xml \
            --module push=push/build/reports/kover/reportCoverage.xml \
            --module signaling=signaling/build/reports/kover/reportCoverage.xml > coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            build/reports/kover/htmlCoverage/
            build/reports/kover/reportCoverage.xml
            coverage-summary.md
          retention-days: 14
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  e2e:
    name: E2E (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAESTRO_VERSION: 2.12.1
      MAESTRO_CLI_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build.gradle reads git tags and commit count for versioning

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Use the placeholder google-services.json
        # The e2e variant never reaches Firebase and needs no secret; this keeps the
        # google-services plugin happy for any variant it configures.
        run: cp .github/ci/google-services.placeholder.json app/google-services.json

      - name: Build the e2e APK and the fake backend
        run: ./gradlew :app:assembleE2eDebug :e2e-backend:installDist

      - name: Start the fake backend
        run: |
          mkdir -p build/maestro
          nohup e2e-backend/build/install/e2e-backend/bin/e2e-backend > build/e2e-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8484/__health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::The fake backend did not become healthy within 60s"
          cat build/e2e-backend.log
          exit 1

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Cache the AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64

      - name: Generate the AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run the Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/e2e/debug/app-e2e-debug.apk
            maestro test e2e/ --format junit --output build/maestro/report.xml --test-output-dir build/maestro

      - name: Upload the Maestro report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report
          path: |
            build/maestro/
            build/e2e-backend.log
          retention-days: 14
          if-no-files-found: warn

  coverage-comment:
    name: Coverage comment
    needs: unit-tests
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage

      - name: Create or update the coverage comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IDS=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- kover-coverage -->"))) | .id')
          ID=${IDS%%$'\n'*}
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@coverage/coverage-summary.md
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@coverage/coverage-summary.md
          fi
