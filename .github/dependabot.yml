version: 2
updates:
  # Reads gradle/libs.versions.toml, where every dependency and plugin version lives.
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
      test:
        patterns: ["junit:*", "org.mockito:*", "org.assertj:*", "org.robolectric:*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
