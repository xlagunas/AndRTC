apply plugin: 'com.android.library'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-allopen'

allOpen {
    annotation 'cat.xlagunas.core.OpenClass'
}

android {
    namespace = 'cat.xlagunas.core'
    compileSdk = 37

    defaultConfig {
        minSdk = 23

        testInstrumentationRunner = "cat.xlagunas.viv.commons.cat.xlagunas.core.di.MockTestRunner"
    }

    buildFeatures {
        buildConfig = true
    }

    flavorDimensions "version"

    productFlavors {
        production {
            buildConfigField "String", "ENDPOINT", '"https://api.viv.xlagunas.dev"'
        }

        development {
            buildConfigField "String", "ENDPOINT", '"http://192.168.0.159:8080"'
        }
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        targetSdk = 35
    }


    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        targetSdk = 35
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas".toString())
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    ksp libs.dagger.compiler
    implementation libs.dagger

    ksp libs.androidx.room.compiler
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.rxjava2

    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.reactivestreams

    implementation libs.material

    implementation libs.gson
    implementation libs.rxandroid
    implementation libs.rxjava

    implementation libs.androidx.appcompat
    implementation libs.timber
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.retrofit.adapter.rxjava2
    implementation libs.okhttp
    implementation libs.okhttp.logging.interceptor

    debugApi libs.chucker
    releaseApi libs.chucker.no.op

    implementation libs.androidx.core.ktx

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.arch.core.testing
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.espresso.core
}