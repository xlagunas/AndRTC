apply plugin: 'com.android.library'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-allopen'

allOpen {
    annotation 'cat.xlagunas.core.OpenClass'
}

android {
    namespace = 'cat.xlagunas.user'
    compileSdk = 35

    defaultConfig {
        minSdk = 23

        testInstrumentationRunner = "cat.xlagunas.viv.commons.cat.xlagunas.core.di.MockTestRunner"
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        dataBinding = false
        viewBinding = true
    }

    flavorDimensions "version"

    productFlavors {
        production {}

        development {}
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        targetSdk = 35
    }
    testOptions {
        targetSdk = 35
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(path: ':core')
    implementation project(path: ':push')

    implementation libs.androidx.appcompat

    implementation libs.material

    ksp libs.dagger.compiler
    implementation libs.dagger

    implementation libs.timber

    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.fragment.ktx


    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.rxjava2

    implementation libs.glide
    implementation libs.glide.okhttp3.integration
    ksp libs.glide.ksp

    implementation libs.androidx.constraintlayout

    api libs.retrofit
    api libs.retrofit.converter.gson
    api libs.retrofit.adapter.rxjava2

    implementation libs.androidx.core.ktx

    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.robolectric
    testImplementation libs.assertj.core
    testImplementation libs.androidx.arch.core.testing
    testImplementation libs.androidx.room.testing

    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.espresso.core
}
