dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Exposed as api so the :conference dynamic feature (which depends on :app's
    // ApplicationComponent) can resolve these modules' Dagger @Modules at kapt time.
    // AGP 8 enforces stricter classpath isolation than AGP 4, which previously leaked these.
    api project(':push')
    api project(':call')
    api project(':contact')
    api project(':user')
    api project(':core')

    debugImplementation libs.leakcanary

    ksp libs.dagger.compiler
    implementation libs.dagger

    implementation libs.material

    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx

    implementation libs.androidx.room.runtime
    implementation libs.androidx.fragment.ktx

    implementation libs.firebase.perf
    implementation libs.firebase.crashlytics

    implementation libs.rxandroid
    implementation libs.rxjava
    implementation libs.coroutines.android
    implementation libs.rxkotlin

    implementation libs.okhttp
    implementation libs.okhttp.logging.interceptor
    implementation libs.timber

    testImplementation project(':test-utils')
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.assertj.core
    testImplementation libs.assertk
    testImplementation libs.androidx.arch.core.testing
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core

    debugImplementation libs.androidx.fragment.testing
    debugImplementation libs.androidx.fragment.testing.manifest
    debugImplementation libs.androidx.test.core
}

static def isMinifyEnabledForBuild() {
    String minifyStatus = System.getenv("MINIFY_ENABLED")
    if (minifyStatus != null) {
        return minifyStatus.toBoolean()
    }
    return false
}

project.tasks.whenTaskAdded {
    if (it.name == "testReleaseUnitTest") {
        it.enabled = false
    }
}

configurations.configureEach {
    // Historical: instrumentation test classpaths pulled com.google.protobuf:protobuf-lite:3.0.1 (via espresso-idling-resource) next to protobuf-javalite:3.21.11 (from firebase-perf), shadowing GeneratedMessageLite and crashing Firebase-Perf init with NoSuchMethodError. The app has no androidTest source set any more; the exclusion is kept as a guard against that transitive dependency coming back.
    exclude group: 'com.google.protobuf', module: 'protobuf-lite'
}

// google-services.json is not versioned (public repository). CI writes it from the
// GOOGLE_SERVICES secret. Locally, set the `viv.googleServicesJson` Gradle property (normally
// in ~/.gradle/gradle.properties) to a copy kept outside the repository: it is the source of
// truth and is copied here whenever it differs, so every checkout and worktree builds.
syncGoogleServicesJson(file('google-services.json'), providers.gradleProperty('viv.googleServicesJson').orNull)

static void syncGoogleServicesJson(File target, String sourcePath) {
    if (sourcePath == null) {
        if (!target.exists()) {
            println "WARNING: app/google-services.json is missing. Set the 'viv.googleServicesJson' " +
                    "Gradle property (e.g. in ~/.gradle/gradle.properties) to the path of your copy. See CLAUDE.md."
        }
        return
    }
    File source = new File(sourcePath)
    if (!source.isFile()) {
        throw new GradleException("viv.googleServicesJson points to '${sourcePath}', which is not a file.")
    }
    if (!target.exists() || source.bytes != target.bytes) {
        java.nio.file.Files.copy(source.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

apply plugin: 'com.google.gms.google-services'

// Placeholder Firebase config for the e2e package (cat.xlagunas.viv.e2e.dev). It is not
// a secret and is copied whenever it differs, like the main google-services.json above.
copyE2eGoogleServicesJson(
        rootProject.file('.github/ci/google-services.placeholder.json'),
        file('src/e2e/google-services.json'))

static void copyE2eGoogleServicesJson(File source, File target) {
    if (!target.exists() || source.bytes != target.bytes) {
        target.parentFile.mkdirs()
        java.nio.file.Files.copy(source.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

// Nothing from src/e2e may leak into the variants that ship or are used for local work.
tasks.register('checkE2eIsolation') {
    group = 'verification'
    description = 'Fails if e2e-only manifest entries appear in the development or production manifests.'
    def manifestTasks = ['processDevelopmentDebugMainManifest', 'processProductionReleaseMainManifest']
    dependsOn manifestTasks
    doLast {
        def forbidden = ['viv-e2e', 'networkSecurityConfig', 'E2ePushLinkActivity', 'firebase_crashlytics_collection_enabled']
        def violations = []
        manifestTasks.each { name ->
            def manifests = tasks.getByName(name).outputs.files.files
                    .collectMany { it.directory ? it.listFiles().toList() : [it] }
                    .findAll { it.name == 'AndroidManifest.xml' }
            if (manifests.isEmpty()) {
                throw new GradleException("No merged AndroidManifest.xml found for ${name}")
            }
            manifests.each { manifest ->
                def text = manifest.text
                forbidden.findAll { text.contains(it) }.each { violations << "${name}: ${it} (${manifest})" }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("e2e-only content leaked into non-e2e manifests:\n" + violations.join('\n'))
        }
    }
}
