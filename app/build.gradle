apply plugin: 'com.android.application'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.google.firebase.firebase-perf'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'kotlin-allopen'


allOpen {
    annotation 'cat.xlagunas.core.OpenClass'
}

android {
    namespace = 'cat.xlagunas.viv'
    compileSdk = 37
    defaultConfig {
        applicationId = "cat.xlagunas.viv"
        minSdk = 24
        targetSdk = 35
        versionCode = rootProject.gitCommitCount
        versionName = rootProject.gitTag
    }

    signingConfigs {
        debug {
            storeFile = file('../buildsystem/debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }

        release {
            storeFile = file('../buildsystem/production.keystore')
            storePassword = System.getenv("PROD_KEYSTORE_PASSWORD")
            keyAlias = System.getenv("PROD_KEY_ALIAS")
            keyPassword = System.getenv("PROD_KEY_PASSWORD")
        }
    }

    flavorDimensions "version"

    productFlavors {
        production {
        }

        development {
            versionNameSuffix = '.local'
        }

        // Variant used by the Maestro E2E flows: talks to :e2e-backend on the host machine
        // (10.0.2.2 from the emulator). Only the debug build type exists. Libraries have no e2e
        // flavor, so they fall back to development.
        e2e {
            applicationIdSuffix = '.e2e'
            matchingFallbacks = ['development']
            buildConfigField "String", "E2E_BACKEND_URL", "\"http://10.0.2.2:8484\""
        }
    }

    sourceSets {
        development.kotlin.srcDir('src/standard/java')
        production.kotlin.srcDir('src/standard/java')
    }

    buildFeatures {
        dataBinding = false
        viewBinding = true
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
            manifestPlaceholders = ["appName": '@string/app_name']
            // Mapping-file upload is a credentialed CI/release concern; disable so local/dev
            // configuration doesn't require the Crashlytics upload task to resolve.
            firebaseCrashlytics {
                mappingFileUploadEnabled = false
            }
        }

        debug {
            minifyEnabled = isMinifyEnabledForBuild()
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationIdSuffix = '.dev'
            versionNameSuffix = '.dev'
            manifestPlaceholders = ["appName": '@string/app_name_dev']
        }
    }

    testOptions {
        animationsDisabled = true
        // Robolectric needs the merged resources (e.g. the call notification strings). This also
        // makes it run at targetSdk 35 instead of minSdk 24, which notification channels need.
        unitTests {
            includeAndroidResources = true
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }



    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    dynamicFeatures = [":conference"]
}

androidComponents {
    beforeVariants(selector().withFlavor('version', 'e2e').withBuildType('release')) { variantBuilder ->
        variantBuilder.enable = false
    }
}


