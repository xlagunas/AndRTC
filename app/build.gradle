apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.firebase.firebase-perf'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'kotlin-allopen'


allOpen {
    annotation 'cat.xlagunas.core.OpenClass'
}

android {
    namespace 'cat.xlagunas.viv'
    compileSdk 34
    defaultConfig {
        applicationId "cat.xlagunas.viv"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode rootProject.gitCommitCount
        versionName rootProject.gitTag
        testInstrumentationRunner "cat.xlagunas.viv.commons.MockTestRunner"
    }

    signingConfigs {
        debug {
            storeFile file('../buildsystem/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            storeFile file('../buildsystem/production.keystore')
            storePassword System.getenv("PROD_KEYSTORE_PASSWORD")
            keyAlias System.getenv("PROD_KEY_ALIAS")
            keyPassword System.getenv("PROD_KEY_PASSWORD")
        }
    }

    flavorDimensions "version"

    productFlavors {
        production {
        }

        development {
            versionNameSuffix '.local'
        }
    }

    buildFeatures {
        dataBinding = true
        viewBinding = true
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            manifestPlaceholders = ["appName": '@string/app_name']
            // Mapping-file upload is a credentialed CI/release concern; disable so local/dev
            // configuration doesn't require the Crashlytics upload task to resolve.
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }

        debug {
            minifyEnabled isMinifyEnabledForBuild()
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            applicationIdSuffix '.dev'
            versionNameSuffix '.dev'
            manifestPlaceholders = ["appName": '@string/app_name_dev']
        }
    }

    testOptions {
        animationsDisabled = true
    }


    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dynamicFeatures = [":conference"]
}


// TODO(probe): Play publishing config disabled with the triplet-play plugin (see top of file).
// play{
//     serviceAccountCredentials = file("publish_credentials.json")
//     track = "alpha"
//     defaultToAppBundles = true
// }

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Exposed as api so the :conference dynamic feature (which depends on :app's
    // ApplicationComponent) can resolve these modules' Dagger @Modules at kapt time.
    // AGP 8 enforces stricter classpath isolation than AGP 4, which previously leaked these.
    api project(':push')
    api project(':call')
    api project(':contact')
    api project(':user')
    api project(':core')

    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    kapt 'com.google.dagger:dagger-compiler:2.51.1'
    implementation 'com.google.dagger:dagger:2.51.1'

    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation "androidx.fragment:fragment-ktx:1.8.5"

    implementation 'com.google.firebase:firebase-perf:21.0.1'
    implementation 'com.google.firebase:firebase-crashlytics:19.0.3'

    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.7'
    implementation 'io.reactivex.rxjava2:rxkotlin:2.2.0'

    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.12.1'
    implementation 'com.jakewharton.timber:timber:5.0.1'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation project(':test-utils')
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'org.apache.httpcomponents:httpclient-android:4.3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'org.mockito:mockito-core:5.23.0', { exclude group: 'net.bytebuddy' }
    androidTestImplementation 'com.linkedin.dexmaker:dexmaker-mockito:2.28.6'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    debugImplementation 'androidx.fragment:fragment-testing:1.8.5'
    debugImplementation 'androidx.test:core:1.7.0'
}

static def isMinifyEnabledForBuild() {
    String minifyStatus = System.getenv("MINIFY_ENABLED")
    if (minifyStatus != null) {
        return minifyStatus.toBoolean()
    }
    return false
}

project.tasks.whenTaskAdded {
    if (it.name == "testReleaseUnitTest") {
        it.enabled = false
    }
}

apply plugin: 'com.google.gms.google-services'
