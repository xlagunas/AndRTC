// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath libs.android.gradle.plugin
        classpath libs.kotlin.gradle.plugin
        classpath libs.kotlin.allopen.plugin
        classpath libs.google.services.plugin
        classpath libs.firebase.perf.plugin
        classpath libs.firebase.crashlytics.plugin
        classpath libs.ksp.gradle.plugin
    }
}

plugins {
    alias(libs.plugins.spotless)
    alias(libs.plugins.kover)
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }
}

spotless {
    kotlin {
        target "**/*.kt"
        ktlint('1.0.1')
    }
}

ext {
    // query git for the SHA, Tag and commit count. Use these to automate versioning.
    gitSha = 'git rev-parse --short HEAD'.execute([], project.rootDir).text.trim()
    gitTag = 'git describe --abbrev=0 --tags'.execute([], project.rootDir).text.trim()
    gitCommitCount = 150 +
            Integer.parseInt('git rev-list --count HEAD'.execute([], project.rootDir).text.trim())
}

// Classes generated by Dagger, Room, view/data binding and the Android toolchain are not worth measuring.
def coverageExcludes = {
    androidGeneratedClasses()
    classes(
            '*.databinding.*',
            '*.BuildConfig',
            '*.R',
            '*.R$*',
            'Dagger*',
            '*.Dagger*',
            '*_Factory',
            '*_Factory$*',
            '*_MembersInjector',
            '*_Provide*Factory',
            '*_Impl',
            '*_Impl$*',
            'hilt_aggregated_deps.*',
            'com.bumptech.glide.*'
    )
}

// New modules that should be covered must be added to this list.
def coverageModules = [':app', ':core', ':user', ':contact', ':call', ':conference', ':push', ':signaling']

subprojects {
    if (coverageModules.contains(path)) {
        apply plugin: 'org.jetbrains.kotlinx.kover'
        kover {
            currentProject {
                createVariant('coverage') {
                    add(['developmentDebug'] as String[], false)
                }
            }
            reports {
                filters {
                    excludes coverageExcludes
                }
            }
        }
    }
}

dependencies {
    coverageModules.each { kover project(it) }
}

kover {
    currentProject {
        // Aggregates the same-named variant of every project added through the kover configuration
        createVariant('coverage') {}
    }
    reports {
        filters {
            excludes coverageExcludes
        }
    }
}
