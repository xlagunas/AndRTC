apply plugin: 'com.android.dynamic-feature'
apply plugin: 'com.google.devtools.ksp'

android {
    namespace = 'cat.xlagunas.conference'
    compileSdk = 37

    defaultConfig {
        minSdk = 24
    }


    flavorDimensions "version"

    productFlavors {
        production {}

        development {}
    }

    buildTypes {
        release {
            manifestPlaceholders = ["appName": '@string/app_name']
        }

        debug {
            manifestPlaceholders = ["appName": '@string/app_name_dev']
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }



}

tasks.withType(Test) {
    testLogging {
        events "passed", "skipped", "failed"
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':app')
    implementation project(':signaling')
    ksp libs.dagger.compiler

    implementation libs.dagger
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx

    implementation libs.androidx.appcompat
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.reactivestreams
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx

    implementation libs.coroutines.android
    implementation libs.coroutines.core
    implementation libs.coroutines.reactive
    implementation libs.coroutines.rx2

    //Need the dependency to compile the bundle in prod with proguard
    compileOnly libs.retrofit.converter.gson

    //TODO once this is propagated implement right version
    implementation(libs.socketio.client) {
        // excluding org.json which is provided by Android
        exclude group: 'org.json', module: 'json'
    }
    implementation libs.webrtc
    implementation libs.rxandroid
    implementation libs.rxjava
    implementation libs.okhttp
    implementation libs.timber
    implementation libs.material

    testImplementation libs.assertj.core
    testImplementation libs.mockito.core
    //testImplementation libs.junit
    testImplementation libs.kotlin.test.junit

    implementation project(':core')
    implementation libs.androidx.constraintlayout
    implementation libs.rxpermissions

    // Core library
    androidTestImplementation libs.androidx.test.core

    // AndroidJUnitRunner and JUnit Rules
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules

    // Assertions
    androidTestImplementation libs.androidx.test.ext.junit
}
