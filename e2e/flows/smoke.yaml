appId: cat.xlagunas.viv.e2e.dev
---
- runScript:
    file: ../scripts/select_scenario.js
    env:
      BACKEND_URL: ${BACKEND_URL || 'http://localhost:8484'}
      SCENARIO: ${SCENARIO || 'logged_in_contacts'}
- clearState
- launchApp
- assertVisible:
    id: search
- tapOn:
    id: action_profile
- tapOn:
    id: username_input_layout
- inputText: anna
- tapOn:
    id: password_text_input
- inputText: secret
- hideKeyboard
- tapOn: Login
- extendedWaitUntil:
    visible: Welcome back.*
    timeout: 10000
- extendedWaitUntil:
    visible: LOGOUT
    timeout: 10000
# The "Welcome back" Snackbar covers the bottom bar: wait for it to go away before tapping.
- extendedWaitUntil:
    notVisible: Welcome back.*
    timeout: 10000
- tapOn:
    id: action_contact
- extendedWaitUntil:
    visible: Jordi
    timeout: 10000
