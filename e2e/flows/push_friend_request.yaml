appId: cat.xlagunas.viv.e2e.dev
---
# Order matters: clearState kills the previous app process, then the scenario is selected,
# then the app launches against a freshly selected backend state.
- clearState
- runScript:
    file: ../scripts/select_scenario.js
    env:
      BACKEND_URL: ${BACKEND_URL || 'http://localhost:8484'}
      SCENARIO: contacts_empty
- launchApp
- extendedWaitUntil:
    visible:
      id: search
    timeout: 20000
# Contacts are stored per user (foreign key to the user row), so the journey starts logged in.
- tapOn:
    id: action_profile
- tapOn:
    id: username_input_layout
- inputText: anna
# The keyboard can cover the password field on tall screens: close it before moving on.
- hideKeyboard
- tapOn:
    id: password_text_input
- inputText: secret
- hideKeyboard
- tapOn: Login
- extendedWaitUntil:
    visible: LOGOUT
    timeout: 10000
# The "Welcome back" Snackbar covers the bottom bar: wait for it to go away before tapping.
- extendedWaitUntil:
    notVisible: Welcome back.*
    timeout: 10000
- tapOn:
    id: action_contact
- assertVisible:
    id: recycler_view
- assertNotVisible: Marta
# The initial fetch must have reached the backend before the scenario changes.
- runScript:
    file: ../scripts/assert_request.js
    env:
      BACKEND_URL: ${BACKEND_URL || 'http://localhost:8484'}
      METHOD: GET
      PATH: /contact/list
# The backend now has a pending request; the push tells the app to refetch the list.
- runScript:
    file: ../scripts/select_scenario.js
    env:
      BACKEND_URL: ${BACKEND_URL || 'http://localhost:8484'}
      SCENARIO: logged_in_contacts
- openLink: viv-e2e://push?type=REQUEST_FRIENDSHIP
- extendedWaitUntil:
    visible: Marta
    timeout: 15000
